name: Public website availability and SEO health
on:
  push:
    branches: [main]
    paths:
      - "scripts/public_site_smoke.py"
      - ".github/workflows/public-site-health.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    name: Check homepage, portfolio, new service pages and sitemap
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify public website without submitting forms
        run: python scripts/public_site_smoke.py
